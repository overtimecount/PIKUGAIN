<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LINKON OT</title>
<style>
:root{--bg:#eef3ff;--card:#ffffffdd;--tx:#0b1d4a;--mut:#6b7a99;--ac:#1f4fd8;--ac2:#00c2ff;--ac3:#8b5cf6;--on:#fff;--b1:#ffb020;--b2:#7c4dff;--b3:#00bfa5;--b4:#ff4081}
[data-t=redwhite]{--bg:#fff0f1;--tx:#3a0a0a;--mut:#8a6a6a;--ac:#d61f2c;--ac2:#ff8a3d;--ac3:#ff3d81}
[data-t=redblack]{--bg:#0d0708;--card:#241014dd;--tx:#fff0f0;--mut:#c9a;--ac:#e11d2e;--ac2:#ff7a3d;--ac3:#ff2d78}
[data-t=greenblack]{--bg:#05110a;--card:#10241adc;--tx:#eafff1;--mut:#8fc9a5;--ac:#10b95a;--ac2:#b6ff3d;--ac3:#00e5c0;--on:#03140a}
[data-t=blackwhite]{--bg:#f1f1f4;--tx:#111;--mut:#777;--ac:#111;--ac2:#ff9d00;--ac3:#ff2d78}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:88px;min-height:100vh;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(70px);opacity:.35;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
body::before{background:var(--ac2);top:-80px;right:-100px}body::after{background:var(--ac3);bottom:-80px;left:-100px;animation-delay:-6s}
@keyframes fl{to{transform:translate(-60px,80px) scale(1.25)}}
#splash{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 35%,#2a5cff,#12084a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .7s,visibility .7s}
#splash.off{opacity:0;visibility:hidden}
#splash img{width:130px;height:130px;border-radius:32px;animation:pop 1.2s cubic-bezier(.2,1.4,.4,1),glow 2.4s infinite 1.2s}
#splash img.bp{border-radius:50%;width:150px;height:150px;object-fit:cover;border:3px solid #ff3b4a;animation:pop 1.2s cubic-bezier(.2,1.4,.4,1),rg 2.4s infinite 1.2s}
#splash h1{letter-spacing:.5em;margin:26px 0 4px;font-size:34px;animation:rise 1.2s .5s both;background:linear-gradient(90deg,#fff,#7fd8ff,#ff9ad5,#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1.2s .5s both,shine 3s linear infinite}
#splash p{opacity:.8;margin:0;animation:rise 1.2s .9s both}
.bar{width:150px;height:5px;border-radius:5px;background:#ffffff33;margin-top:26px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb020,#ff4081,#7c4dff);animation:ld 2.2s forwards}
@keyframes pop{from{transform:scale(0) rotate(-200deg)}}@keyframes rise{from{opacity:0;transform:translateY(24px)}}
@keyframes glow{50%{box-shadow:0 0 50px #5aa0ff}}@keyframes rg{50%{box-shadow:0 0 55px #ff3b4a}}@keyframes ld{from{width:0}to{width:100%}}@keyframes shine{to{background-position:200%}}
header{position:sticky;top:0;z-index:5;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));background:linear-gradient(110deg,var(--ac),var(--ac3),var(--ac2));background-size:200% 100%;animation:shine 8s linear infinite;color:var(--on);display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.5px;box-shadow:0 8px 28px #0004;border-radius:0 0 26px 26px}
header img{width:36px;height:36px;border-radius:11px;box-shadow:0 0 0 2px #fff8}
main{padding:14px;max-width:640px;margin:auto}
.card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:0 10px 32px #0002;border:1px solid #ffffff40;animation:in .45s both}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}}
h3{margin:0 0 12px;font-size:18px}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac3) 55%,var(--ac2));color:#fff;border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:#ffffff26}
.hero .lbl{opacity:.85;font-size:13px}.hero .big{font-size:38px;font-weight:900;margin:2px 0 12px;text-shadow:0 4px 16px #0004}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips span{background:#ffffff2e;border-radius:30px;padding:7px 12px;font-size:13px;font-weight:700;backdrop-filter:blur(6px)}
nav{position:fixed;bottom:10px;left:10px;right:10px;display:flex;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:26px;box-shadow:0 10px 36px #0005;padding:6px;z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0;font-size:11px;font-weight:700;border-radius:20px;transition:.3s}
nav button b{display:block;font-size:22px;font-weight:400;transition:.3s}
nav button.on{color:var(--on);background:linear-gradient(120deg,var(--ac),var(--ac3));box-shadow:0 6px 16px #0004}nav button.on b{transform:scale(1.2) translateY(-2px)}
input,select,textarea{width:100%;padding:13px;border-radius:14px;border:2px solid #8883;background:#8881;color:var(--tx);font-size:16px;margin:4px 0 10px;transition:.2s}
input:focus,textarea:focus{outline:0;border-color:var(--ac2);box-shadow:0 0 0 4px #00c2ff30}
label{font-size:13px;color:var(--mut);font-weight:600}
.btn{border:0;background:linear-gradient(120deg,var(--ac),var(--ac3));color:var(--on);padding:14px 18px;border-radius:16px;font-size:16px;font-weight:800;width:100%;box-shadow:0 8px 20px #0003;transition:.2s}
.btn.s{width:auto;padding:9px 15px;font-size:14px;border-radius:30px}.btn:active{transform:scale(.96)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grid div{aspect-ratio:1;border-radius:14px;background:#8881;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:700;position:relative;transition:.2s}
.grid div:active{transform:scale(.9)}
.grid .h{aspect-ratio:auto;background:none;font-size:12px;color:var(--mut)}
.grid .fri{background:linear-gradient(135deg,#ffb02033,#ff408133);color:var(--ac3)}
.grid small{font-size:10px;font-weight:800}
.grid .t-d{background:linear-gradient(135deg,#ffb020,#ff7a00);color:#fff;box-shadow:0 6px 14px #ff7a0066}
.grid .t-n{background:linear-gradient(135deg,#7c4dff,#3d1fd1);color:#fff;box-shadow:0 6px 14px #7c4dff66}
.grid .t-f6{background:linear-gradient(135deg,#00d9b5,#0097a7);color:#fff;box-shadow:0 6px 14px #00bfa566}
.grid .t-f18{background:linear-gradient(135deg,#ff4081,#d500f9);color:#fff;box-shadow:0 6px 14px #ff408166}
.grid .set small{color:#fff}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:12px;color:var(--mut);font-weight:600}.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mh b{font-size:18px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed #8883}
.row .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.row span.n{flex:1;font-size:14px}.row b{font-size:16px}
.tot{font-size:28px;font-weight:900;background:linear-gradient(90deg,var(--ac),var(--ac3));-webkit-background-clip:text;background-clip:text;color:transparent}
.post img{width:100%;border-radius:16px;margin-top:8px}.who{font-weight:800}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{padding:11px 15px;border-radius:30px;border:3px solid transparent;color:#fff;font-weight:800;box-shadow:0 6px 14px #0003}
#pick{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end}
#pick>div{background:var(--bg);width:100%;padding:20px;border-radius:28px 28px 0 0;animation:in .3s}
#pick .btn{margin-bottom:10px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style><script>
setTimeout(function(){var e=document.getElementById('splash');if(e)e.classList.add('off')},3500);
window.onerror=function(m,u,l){var d=document.createElement('div');d.style.cssText='position:fixed;left:8px;right:8px;bottom:90px;z-index:999;background:#b00020;color:#fff;padding:10px;border-radius:12px;font:12px sans-serif';d.textContent='Error: '+m+' (line '+l+')';document.body.appendChild(d)};
</script>
